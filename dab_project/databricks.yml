# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: b37f8922-d1cb-4ed1-afb3-ed726fd2d4b9

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      source_linked_deployment: false
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: dab_catalog
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    presets:
      name_prefix: prod_
      source_linked_deployment: false
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/kushchhatbar19@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kushchhatbar19@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_catalog
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
